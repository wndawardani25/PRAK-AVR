<html>
<head>
  <meta charset="utf-8">
  <title>Kampus Mini AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true;">

    <!-- Pencahayaan -->
    <a-light type="ambient"
             color="#ffffff"
             intensity="0.6"></a-light>

    <a-light type="directional"
             color="#ffffff"
             intensity="0.8"
             position="1 3 2"></a-light>

    <!-- Scene kampus mini -->
    <a-marker preset="hiro">

      <!-- Alas kampus -->
      <a-plane id="alas-kampus"
               position="0 0 0"
               rotation="-90 0 0"
               width="2"
               height="2"
               color="#90BE6D"></a-plane>

      <!-- Gedung kampus -->
<a-box id="gedung-kampus"
       position="0 0.35 0"
       width="0.8"
       height="0.7"
       depth="0.6"
       src="assets/tekstur.jpg"></a-box>

      <!-- Atap gedung -->
      <a-box id="atap-gedung"
             position="0 0.75 0"
             width="0.9"
             height="0.12"
             depth="0.7"
             color="#E76F51"></a-box>

      <!-- Pohon 1: batang -->
      <a-cylinder id="batang-pohon-1"
                  position="-0.65 0.2 0.3"
                  radius="0.07"
                  height="0.4"
                  color="#8D5524"></a-cylinder>

      <!-- Pohon 1: daun -->
      <a-sphere id="daun-pohon-1"
                position="-0.65 0.48 0.3"
                radius="0.22"
                color="#2D6A4F"></a-sphere>

      <!-- Pohon 2: batang -->
      <a-cylinder id="batang-pohon-2"
                  position="0.65 0.2 0.3"
                  radius="0.07"
                  height="0.4"
                  color="#8D5524"></a-cylinder>

      <!-- Pohon 2: daun -->
      <a-sphere id="daun-pohon-2"
                position="0.65 0.48 0.3"
                radius="0.22"
                color="#2D6A4F"></a-sphere>

      <!-- Bola bergerak naik turun -->
      <a-sphere id="bola-animasi"
                position="0 0.9 -0.65"
                radius="0.12"
                color="#4C6EF5"
                animation="property: position; dir: alternate; to: 0 1.2 -0.65; dur: 1500; loop: true">
      </a-sphere>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
